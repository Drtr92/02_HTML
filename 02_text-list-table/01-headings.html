<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Headings</title>
    <style>
        /* .tktk 클래스를 가진 모든 요소에 적용 */
        .tktk {
            font-size: 30px;            /* 크기 30px */
            color: tomato;              /* 토마토 색상 */
            font-weight: bold;          /* strong (굵게) */
            font-style: italic;         /* em (기울임꼴) */
        }
    </style>
</head>
<body>
<!--
   제목 태그 (Heading) : h1 ~ h6
   h1 이 가장 큰 단위의 제목
   h6 이 가장 작은 단위의 제목
   !!!!!! 모양을 외울 필요는 없음 !!!!!!
-->
<h1>제목 1</h1>
<h2>제목 2</h2>
<h3>제목 3</h3>
<h4>제목 4</h4>
<h5>제목 5</h5>
<h6>제목 6</h6>

<hr />  <!-- 가로선 -->

<!-- 제목 태그는 크기가 아니라 "단계" 로서 선택하여 사용 -->
<h1>HTML 입문</h1>
<h2>1장. 태그</h2>
<h3>1-1. 짝 태그</h3>
<h3>1-2. 단독 태그</h3>
<h2>2장 목록</h2>

<p class="tktk">이 문장은 tktk 스타일을 받은 일반 문단입니다.</p>
<p>문장 속에서 <span class="tktk">이 단어만</span> 강조할 수도 있습니다.</p>

</body>
</html>
