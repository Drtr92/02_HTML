<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>exercise</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 24px;
            margin-top: 50px;
            margin-left: 40px;
        }

        th,
        td {
            border: 2px solid #94a3b8;
            padding: 40px 32px;
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <caption style="color: tomato;font-size: 50px;font-weight: bold;margin-bottom: 30px;">
        행 병합, <em style="color: indigo">열 병합</em>
    </caption>
    <tbody>
    <tr>
        <td>1번</td>
        <td>2번</td>
        <td>3번</td>
        <td>4번</td>
    </tr>
    <tr>
        <td>5번</td>
        <td colspan="2" bgcolor="#ffd700"><strong>6번</strong></td>
        <td>7번</td>
    </tr>
    <tr>
        <td>9번</td>
        <td rowspan="2" bgcolor="aqua">10번</td>
        <td>11번</td>
        <td>12번</td>
    </tr>
    <tr>
        <td>13번</td>
        <td>14번</td>
        <td>15번</td>
    </tr>
    </tbody>
</table>


</body>
</html>
